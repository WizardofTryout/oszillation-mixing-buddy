name: Dependency Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Verify .npmrc ignore-scripts is enforced
        run: |
          grep "ignore-scripts=true" .npmrc

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high
